<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Capture — LocalShot</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="gallery.html" aria-label="Retour à la galerie">←</a>
    <a class="brand" href="gallery.html"><img src="../icons/icon-128.png" alt=""><span>LocalShot</span></a>
    <span class="pill">100&nbsp;% local</span>
    <div class="spacer"></div>
    <div class="actions">
      <button id="copyImg" class="btn primary">Copier l'image</button>
      <button id="download" class="btn">Télécharger</button>
      <button id="share" class="btn">Partager</button>
      <button id="del" class="btn danger">Supprimer</button>
    </div>
  </header>
  <main class="viewer">
    <div id="stage" class="stage"><img id="img" alt="Capture d'écran"></div>
    <section class="details">
      <input id="title" class="title-input" maxlength="300" aria-label="Titre de la capture">
      <div class="meta">
        <span id="meta" class="muted"></span>
        <a id="source" class="source" target="_blank" rel="noopener noreferrer" hidden>URL source ↗</a>
      </div>
      <div id="shareBox" class="share" hidden>
        <label for="shareUrl">Lien de partage</label>
        <div class="share-row">
          <input id="shareUrl" readonly>
          <button id="copyLink" class="btn primary">Copier</button>
          <button id="unshare" class="btn danger">Arrêter le partage</button>
        </div>
      </div>
      <p id="shareHint" class="hint"></p>
    </section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
