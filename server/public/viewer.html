<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Capture — LocalShot</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f97316">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="icon" href="/assets/icon.png">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/player.css">
  <script type="module" src="/assets/i18n.js"></script>
  <script type="module" src="/assets/icons.js"></script>
</head>
<body>
  <header class="topbar">
    <a id="back" class="back" href="/" hidden aria-label="Retour à la galerie" data-icon="back"></a>
    <a class="brand" href="/"><img src="/assets/icon.png" alt=""><span>LocalShot</span></a>
    <span class="pill">100&nbsp;% local</span>
    <div class="spacer"></div>
    <div class="actions">
      <button id="copyLink" class="btn primary">Copier le lien</button>
      <button id="copyImg" class="btn">Copier l'image</button>
      <a id="download" class="btn" href="#">Télécharger</a>
      <button id="del" class="btn danger" hidden>Supprimer</button>
    </div>
  </header>
  <main class="viewer">
    <div id="stage" class="stage is-loading"><span class="loader" role="status" aria-label="Chargement…"></span><img id="img" alt="Capture d'écran" hidden></div>
    <div id="transcript" class="transcript" hidden></div>
    <section class="details">
      <input id="title" class="title-input" maxlength="300" aria-label="Titre de la capture">
      <div class="meta">
        <span id="meta" class="muted"></span>
        <a id="source" class="source" target="_blank" rel="noopener noreferrer" hidden data-icon="external"><span>URL source</span></a>
      </div>
      <div class="share">
        <label for="shareUrl">Lien de partage</label>
        <input id="shareUrl" readonly>
        <p id="shareHint" class="hint"></p>
      </div>
      <div id="linkOpts" class="link-opts" hidden></div>
      <div id="comments" class="comments" hidden></div>
    </section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/assets/viewer.js"></script>
  <script type="module" src="/assets/pwa.js"></script>
</body>
</html>
