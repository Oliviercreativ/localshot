<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie privée — LocalShot</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#f97316"><link rel="apple-touch-icon" href="/assets/icon-192.png"><link rel="icon" href="/assets/icon.png"><link rel="stylesheet" href="/assets/app.css">  <script type="module" src="/assets/i18n.js"></script>
</head>
<body><main class="center-msg"><img src="/assets/icon.png" alt="" width="64" height="64">
<h1>Galerie privée</h1>
<p id="noauth" class="muted">La liste des captures n'est visible que depuis l'ordinateur qui les a prises.<br>Ouvrez un lien de partage (<code>/c/…</code>) pour voir une capture.</p>
<form id="login" class="login" hidden>
  <p class="muted">Entrez la clé d'accès de votre serveur LocalShot. Cet appareil s'en souviendra.</p>
  <input id="key" type="password" autocomplete="current-password" placeholder="Clé d'accès" required>
  <button class="btn primary" type="submit">Ouvrir la galerie</button>
  <p id="err" class="error" hidden></p>
</form>
</main><script type="module" src="/assets/login.js"></script><script type="module" src="/assets/pwa.js"></script>
</body></html>
